    let rain = [];

   let row = "";

let w = weather[i];
total += w.temp;
if(w.temp < min){
    min = w.temp;

}
if(w.temp > max){
max = w.temp;
}

if(w.condition === "Rain"){
    rain.push(w.hour);

}
if(w.temp >= 40){
    heat.push(w.hour);
}
if(w.condition === "Cloudy"){
    cold.push(w.hour);
}



let desc = "";
let icon = "";


if(w.condition === "Rain"){
    desc = "Extram Rain plz carry umbrella"
  icon = "🌧️";
}
else if(w.condition === "Sunny"){
  desc = "Extram heat plz stay hydrated"
  icon = "☀️";
}
else if(w.condition === "Cloudy"){
    desc = "Extram cold plz stay home"
  icon = "☁️";
}else{
    desc = "Foggy weather plz drive carefully"
  icon = "🌫️";
}

 row += `
        <tr>
            <td>${w.hour}</td>
            <td>${w.temp}°C</td>
            <td>${w.humidity}%</td>
            <td>${w.wind} km/h</td>
            <td>${w.condition} ${icon}</td>
            <td>${desc}</td>
        </tr>
        `;

    }



let avg = total / weather.length;

document.querySelector(".data").innerHTML = `

<p> Max temp : - ${max}C</p>
<p> Min temp : - ${min}C</p>
<p> Avg temp : - ${avg}C</p>

<p> Heat : - ${heat}</p>

 <table>

                    <th>Humidity</th>
                    <th>Wind</th>
                    <th>Condition</th>
                    <th>Description</th>

            </thead>

`;
