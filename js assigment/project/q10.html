  function disprod(){
    let table = document.querySelector("#prdt");
     table.innerHTML="";
    prdcs.forEach((p,inx)=>{
  let lowtst = p.stock < p.reorder ? "Low Stock" : "Stock Available";
   table.innerHTML += `
        <tr>
            <td>${p.id}</td>
            <td>${p.name}</td>

            <td>${p.price}</td>

            <td>${p.supplier}</td>
            <td>${lowtst}</td>
            <td>${p.sold}</td>
            <td><button class="add" onclick="add(${inx})">add stock</button><button class="sold"onclick="sold(${inx})">sell</button>
                <button class= "adt" onclick="adts(${inx})">audit</button>
                </td>
        </tr>
   `;
    });
  

  }


  function add(inx){

    let qty = Number(prompt("enter the quantity to add"));
    if(qty > 0){
        prdcs[inx].stock += qty;
        disprod()

    }
    
upd()

  }




  function sold(inx){
    let qty = Number(prompt("enter the qty sell"));
    if(qty > 0 && qty <= prdcs[inx].stock){
    prdcs[inx].stock -= qty
    prdcs[inx].sold += qty
    // disprod()

    }
    
upd()
    
  }


  function adts(inx){
    let newqty = Number(prompt("enter the new stock"));
    if(newqty >= 0){
        prdcs[inx].stock += newqty
        // disprod()
        
upd()

    }
    

  }
