    <script>

        let corpin = "123456"
        let attem = 3;
        let balance = 10000;

function login(){
let input = document.querySelector('#login').value;
document.querySelector('#login').value="";
  if(input === corpin){
    document.querySelector('#msg').innerText = "Login successful (PIN: ****)";
    document.querySelector('#menu').style.display = "block";
    // document.querySelector(".loginss").style.display = "none";

    timer();
  }else{
 attem--;

document.querySelector('#msg').innerText = 'wrong pin attempt left -' + attem;
if(attem === 0){
document.querySelector('#msg').innerText = ' account was locked'
}
  }
timer()

}




function balances(){
document.querySelector('#msg1').innerText = "Balances   :-" + balance;
transe.push(`Balance : ${balance}`);

timer()
}


function deposit(){
  let amt = Number(prompt("enter the amount"));
  if(amt <= 0){
   document.querySelector('#msg1').innerText = 'invalid amount'
  }else{
   balance += amt 
document.querySelector('#msg1').innerText = `Deposite  :-${amt}`;
transe.push(`deposit : +${amt}`);
  }
   timer()
}




function witd(){
  let amt1 = Number(prompt("enter the amout"))
  if(amt1 > balance){
  document.querySelector('#msg1').innerText = "insuficiant balance"
  }else if(usetoday + amt1 > dailylimt){
document.querySelector('#msg1').innerText = "today limit exceed 50000"
  }else{
    document.querySelector('#msg1').innerText = `withdrow amt today :- ${amt1}`;
    balance -= amt1
    usetoday += amt1;
    transe.push(`withdrow : -${amt1}`);
    
  }
   timer()
}
